<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a32"><title>Flappy Mass Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,520px);height:min(100dvh,900px);overflow:hidden;background:linear-gradient(#162b4c,#58839b 58%,#e3a66c);box-shadow:0 20px 80px #0008}.game{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}.top{position:absolute;z-index:2;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px;font-weight:900}.pill{padding:9px 13px;border:1px solid #ffffff55;border-radius:30px;background:#07142688;backdrop-filter:blur(8px);font-size:12px;letter-spacing:.08em}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:24px;background:#07142666;backdrop-filter:blur(3px)}.panel{width:min(100%,390px);padding:30px 22px;text-align:center;border:1px solid #ffffff55;border-radius:27px;background:linear-gradient(145deg,#172941f2,#0c1729f2);box-shadow:0 20px 60px #0008}.tag{color:#ffd078;font-size:11px;font-weight:900;letter-spacing:.22em}.title{font-size:clamp(38px,10vw,54px);line-height:.95;letter-spacing:-.06em;font-weight:1000;margin:13px 0}.sub{max-width:290px;margin:14px auto 22px;color:#c8d5e5;line-height:1.55;font-size:14px}.btn{min-width:190px;border:0;border-radius:14px;padding:15px 24px;background:linear-gradient(135deg,#ffcf67,#ff8e42);color:#21150a;font-weight:1000;font-size:15px;letter-spacing:.05em;box-shadow:0 6px 0 #a94f24;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a94f24}.hint{margin-top:18px;color:#bdcbd9;font-size:12px}.hidden{display:none}.final{font-size:58px;font-weight:1000;margin:5px 0 18px}.footer{position:absolute;z-index:2;bottom:12px;left:0;right:0;text-align:center;color:#ffffff9c;font-size:11px;pointer-events:none}@media(min-width:600px){.shell{height:min(94dvh,900px);border-radius:24px}}
</style></head>
<body><main class="shell" id="shell"><canvas class="game" id="game"></canvas><div class="top"><div class="pill">✦ FLAPPY MASS</div><div class="pill">SCORE&nbsp; <span id="score">0</span></div></div>
<section class="overlay" id="start"><div class="panel"><div class="tag">THE ONE-TAP CHALLENGE</div><div class="title">FLAPPY<br>MASS</div><p class="sub">Tap to fly. Slip through the gaps. Don't let the legends stop your run.</p><button class="btn" id="startBtn">START GAME</button><div class="hint">TAP · CLICK · SPACE TO FLY</div></div></section>
<section class="overlay hidden" id="over"><div class="panel"><div class="tag">RUN COMPLETE</div><div class="title">GAME OVER</div><p class="sub">Your final score</p><div class="final" id="final">0</div><button class="btn" id="again">PLAY AGAIN</button><div class="hint">TAP · CLICK · SPACE TO FLY</div></div></section><div class="footer">FLAPPY MASS GAME · KEEP FLYING</div></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),shell=document.querySelector('#shell'),start=document.querySelector('#start'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),finalEl=document.querySelector('#final');let W,H,dpr,active=false,dead=false,score=0,tick=0,last=0,raf=0,player,pipes=[],audio;
function sound(freq,duration,type='sine',volume=.045){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);if(!active){player={x:W*.27,y:H*.43,vy:0,r:Math.max(20,Math.min(27,W*.055))};draw()}}
function reset(){score=0;tick=0;pipes=[];scoreEl.textContent='0';player={x:W*.27,y:H*.43,vy:0,r:Math.max(20,Math.min(27,W*.055))};dead=false;active=true;start.classList.add('hidden');over.classList.add('hidden');last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function flap(){if(!active)return;player.vy=-H*.0071;sound(620,.09,'triangle')}
function end(){if(dead)return;dead=true;active=false;cancelAnimationFrame(raf);sound(115,.45,'sawtooth',.07);finalEl.textContent=score;over.classList.remove('hidden')}
function spawn(){const gap=Math.max(165,Math.min(205,H*.23)),margin=105,center=margin+Math.random()*(H-2*margin);pipes.push({x:W+40,center,gap,w:Math.max(78,W*.18),passed:false})}
function background(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#183150');g.addColorStop(.6,'#6b91a0');g.addColorStop(1,'#e5ae75');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<5;i++){let xx=((i*151-tick*.3)%(W+160)+W+160)%(W+160)-70,yy=H*(.13+(i%3)*.12);x.fillStyle='#ffffff28';x.beginPath();x.ellipse(xx,yy,42,11,0,0,7);x.ellipse(xx+22,yy-5,25,14,0,0,7);x.ellipse(xx+46,yy,35,10,0,0,7);x.fill()}x.fillStyle='#18283c66';x.beginPath();x.moveTo(0,H*.83);x.lineTo(W*.25,H*.68);x.lineTo(W*.48,H*.83);x.lineTo(W*.72,H*.69);x.lineTo(W,H*.82);x.lineTo(W,H);x.lineTo(0,H);x.fill()}
function obstacle(p,top){const y=top?0:p.center+p.gap/2,h=top?p.center-p.gap/2:H-y;if(h<=0)return;x.save();x.shadowColor='#0008';x.shadowBlur=12;x.shadowOffsetY=4;x.fillStyle='#f1e9dc';x.fillRect(p.x,y,p.w,h);x.shadowBlur=0;x.fillStyle='#d3c5b1';x.fillRect(p.x,y,p.w,10);x.fillStyle='#b5a58f';x.fillRect(p.x+p.w*.12,y+10,p.w*.76,h-10);x.textAlign='center';x.textBaseline='middle';x.font='bold '+Math.max(24,p.w*.55)+'px system-ui';x.fillStyle='#6b6259';x.fillText('✦',p.x+p.w/2,y+h*.48);x.restore()}
function drawPlayer(){x.save();x.translate(player.x,player.y);x.rotate(Math.max(-.35,Math.min(.7,player.vy*.04)));x.shadowColor='#0009';x.shadowBlur=12;x.fillStyle='#ffc45f';x.beginPath();x.arc(0,0,player.r+3,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#263c55';x.beginPath();x.arc(0,0,player.r,0,7);x.fill();x.font=player.r*1.65+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('😎',0,1);x.restore()}
function draw(){background();pipes.forEach(p=>{obstacle(p,true);obstacle(p,false)});drawPlayer()}
function loop(t){if(!active)return;const dt=Math.min((t-last||16.67)/16.67,2);last=t;tick++;player.vy+=.34*dt;player.y+=player.vy*dt;if(tick%108===1)spawn();const speed=Math.max(2.8,W*.006);pipes.forEach(p=>{p.x-=speed*dt;if(!p.passed&&p.x+p.w<player.x){p.passed=true;score++;scoreEl.textContent=score}});pipes=pipes.filter(p=>p.x+p.w>-20);const r=player.r*.78;let hit=player.y-r<0||player.y+r>H;for(const p of pipes){if(player.x+r>p.x&&player.x-r<p.x+p.w&&(player.y-r<p.center-p.gap/2||player.y+r>p.center+p.gap/2))hit=true}draw();if(hit){end();return}raf=requestAnimationFrame(loop)}
function jump(e){if(e)e.preventDefault();if(!active){if(!dead){reset();flap()}return}flap()}
c.addEventListener('pointerdown',jump);document.querySelector('#startBtn').addEventListener('click',e=>{e.stopPropagation();reset();flap()});document.querySelector('#again').addEventListener('click',e=>{e.stopPropagation();reset();flap()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!active&&!dead){reset();flap()}else flap()}});window.addEventListener('resize',resize);resize();draw()})();
</script></body></html>
