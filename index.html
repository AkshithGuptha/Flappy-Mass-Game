<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a32"><title>Flappy Mass Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,520px);height:min(100dvh,900px);overflow:hidden;background:linear-gradient(#162b4c,#58839b 58%,#e3a66c);box-shadow:0 20px 80px #0008}.game{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}.top{position:absolute;z-index:2;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px;font-weight:900}.pill{padding:9px 13px;border:1px solid #ffffff55;border-radius:30px;background:#07142688;backdrop-filter:blur(8px);font-size:12px;letter-spacing:.08em}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:24px;background:#07142666;backdrop-filter:blur(3px)}.panel{width:min(100%,390px);padding:30px 22px;text-align:center;border:1px solid #ffffff55;border-radius:27px;background:linear-gradient(145deg,#172941f2,#0c1729f2);box-shadow:0 20px 60px #0008}.tag{color:#ffd078;font-size:11px;font-weight:900;letter-spacing:.22em}.title{font-size:clamp(38px,10vw,54px);line-height:.95;letter-spacing:-.06em;font-weight:1000;margin:13px 0}.sub{max-width:290px;margin:14px auto 22px;color:#c8d5e5;line-height:1.55;font-size:14px}.btn{min-width:190px;border:0;border-radius:14px;padding:15px 24px;background:linear-gradient(135deg,#ffcf67,#ff8e42);color:#21150a;font-weight:1000;font-size:15px;letter-spacing:.05em;box-shadow:0 6px 0 #a94f24;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a94f24}.hint{margin-top:18px;color:#bdcbd9;font-size:12px}.hidden{display:none}.final{font-size:58px;font-weight:1000;margin:5px 0 18px}.footer{position:absolute;z-index:2;bottom:12px;left:0;right:0;text-align:center;color:#ffffff9c;font-size:11px;pointer-events:none}
</style></head><body><main class="shell" id="shell"><canvas class="game" id="game"></canvas><audio id="flySound" src="assets/fly.mp3" preload="auto"></audio><audio id="crashSound" src="assets/crash.mp3" preload="auto"></audio><div class="top"><div class="pill">✦ FLAPPY MASS</div><div class="pill">SCORE&nbsp; <span id="score">0</span></div></div>
<section class="overlay" id="start"><div class="panel"><div class="tag">THE ONE-TAP CHALLENGE</div><div class="title">FLAPPY<br>MASS</div><p class="sub">Tap to fly. Slip through the gaps. Don't let the legends stop your run.</p><button class="btn" id="startBtn">START GAME</button><div class="hint">TAP · CLICK · SPACE TO FLY</div></div></section>
<section class="overlay hidden" id="over"><div class="panel"><div class="tag">RUN COMPLETE</div><div class="title">GAME OVER</div><p class="sub">Your final score</p><div class="final" id="final">0</div><button class="btn" id="again">PLAY AGAIN</button><div class="hint">TAP · CLICK · SPACE TO FLY</div></div></section><div class="footer">FLAPPY MASS GAME · KEEP FLYING</div></main>
<script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),shell=document.querySelector('#shell'),start=document.querySelector('#start'),over=document.querySelector('#over'),scoreEl=document.querySelector('#score'),finalEl=document.querySelector('#final');const hero=new Image(),foe=new Image();hero.src='assets/player.webp';foe.src='assets/obstacle.webp';let W,H,dpr,active=false,dead=false,score=0,tick=0,last=0,raf=0,player,pipes=[];const flySound=document.querySelector('#flySound'),crashSound=document.querySelector('#crashSound');function playSound(s){try{s.currentTime=0;const p=s.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}

function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);if(!active){player={x:W*.27,y:H*.43,vy:0,r:Math.max(23,Math.min(31,W*.065))};draw()}}
function reset(){score=0;tick=0;pipes=[];scoreEl.textContent='0';player={x:W*.27,y:H*.43,vy:0,r:Math.max(23,Math.min(31,W*.065))};dead=false;active=true;start.classList.add('hidden');over.classList.add('hidden');last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function flap(){if(!active)return;player.vy=-H*.0071;playSound(flySound)}
function end(){if(dead)return;dead=true;active=false;cancelAnimationFrame(raf);playSound(crashSound);finalEl.textContent=score;over.classList.remove('hidden')}
function spawn(){const gap=Math.max(170,Math.min(210,H*.24)),margin=115,center=margin+Math.random()*(H-2*margin);pipes.push({x:W+40,center,gap,w:Math.max(86,W*.19),passed:false})}
function background(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#183150');g.addColorStop(.6,'#6b91a0');g.addColorStop(1,'#e5ae75');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<5;i++){let xx=((i*151-tick*.3)%(W+160)+W+160)%(W+160)-70,yy=H*(.13+(i%3)*.12);x.fillStyle='#ffffff28';x.beginPath();x.ellipse(xx,yy,42,11,0,0,7);x.ellipse(xx+22,yy-5,25,14,0,0,7);x.ellipse(xx+46,yy,35,10,0,0,7);x.fill()}x.fillStyle='#18283c66';x.beginPath();x.moveTo(0,H*.83);x.lineTo(W*.25,H*.68);x.lineTo(W*.48,H*.83);x.lineTo(W*.72,H*.69);x.lineTo(W,H*.82);x.lineTo(W,H);x.lineTo(0,H);x.fill()}
function drawObstacle(p,top){const y=top?0:p.center+p.gap/2,h=top?p.center-p.gap/2:H-y;if(h<=0)return;x.save();x.shadowColor='#0009';x.shadowBlur=12;x.shadowOffsetY=4;x.fillStyle='#f4eee4';x.fillRect(p.x,y,p.w,h);x.shadowBlur=0;x.fillStyle='#bcae9c';x.fillRect(p.x,y,p.w,8);if(foe.complete&&foe.naturalWidth){x.save();x.beginPath();x.rect(p.x,y+8,p.w,Math.max(0,h-8));x.clip();const iw=p.w,ih=iw*foe.height/foe.width;let yy=y+8;if(!top)yy=y+h-ih;x.drawImage(foe,p.x,yy,iw,ih);x.restore()}x.restore()}
function drawPlayer(){x.save();x.translate(player.x,player.y);x.rotate(Math.max(-.25,Math.min(.55,player.vy*.035)));x.shadowColor='#0009';x.shadowBlur=12;x.fillStyle='#fff';x.beginPath();x.arc(0,0,player.r+4,0,Math.PI*2);x.fill();x.shadowBlur=0;if(hero.complete&&hero.naturalWidth){x.save();x.beginPath();x.arc(0,0,player.r,0,Math.PI*2);x.clip();const s=player.r*2.25;x.drawImage(hero,-s/2,-s/2,s,s);x.restore()}else{x.fillStyle='#263c55';x.beginPath();x.arc(0,0,player.r,0,7);x.fill()}x.restore()}
function draw(){background();pipes.forEach(p=>{drawObstacle(p,true);drawObstacle(p,false)});drawPlayer()}
function loop(t){if(!active)return;const dt=Math.min((t-last||16.67)/16.67,2);last=t;tick++;player.vy+=.34*dt;player.y+=player.vy*dt;if(tick%108===1)spawn();const speed=Math.max(2.8,W*.006);pipes.forEach(p=>{p.x-=speed*dt;if(!p.passed&&p.x+p.w<player.x){p.passed=true;score++;scoreEl.textContent=score}});pipes=pipes.filter(p=>p.x+p.w>-20);const r=player.r*.78;let hit=player.y-r<0||player.y+r>H;for(const p of pipes){if(player.x+r>p.x&&player.x-r<p.x+p.w&&(player.y-r<p.center-p.gap/2||player.y+r>p.center+p.gap/2))hit=true}draw();if(hit){end();return}raf=requestAnimationFrame(loop)}
function jump(e){if(e)e.preventDefault();if(!active){if(!dead){reset();flap()}return}flap()}
c.addEventListener('pointerdown',jump);document.querySelector('#startBtn').addEventListener('click',e=>{e.stopPropagation();reset();flap()});document.querySelector('#again').addEventListener('click',e=>{e.stopPropagation();reset();flap()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!active&&!dead){reset();flap()}else flap()}});window.addEventListener('resize',resize);resize();draw()})();
</script></body></html>
